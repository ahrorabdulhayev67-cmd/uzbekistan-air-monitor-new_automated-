name: TashkentAQ V8.1 arxiv

on:
  schedule:
    - cron: "37 21 * * *"      # har kuni 02:37 Toshkent vaqti
  workflow_dispatch:

concurrency:
  group: v81-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pandas==2.3.3 pyarrow supabase==2.31.0
      - name: Arxivlash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python v81/v81_archive.py
