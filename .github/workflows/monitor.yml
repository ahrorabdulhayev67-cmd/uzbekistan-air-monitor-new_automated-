name: Havo Monitoringi Pipeline

on:
  workflow_dispatch:          # asosiy: Supabase pg_cron har soat :13 da chaqiradi
  schedule:
    - cron: "43 * * * *"      # zaxira: soat boshidan uzoq (GitHub soat boshida eng band)

concurrency:                  # bir vaqtda ikkita run bo'lmasin
  group: collector
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v5

      - name: Python o'rnatish
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Kutubxonalar o'rnatish
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: DNS va tarmoq tekshirish
        run: |
          echo "=== DNS tekshirish ==="
          nslookup monitoring.meteo.uz || echo "monitoring.meteo.uz DNS xato"
          nslookup data.meteo.uz       || echo "data.meteo.uz DNS xato"
          nslookup api.open-meteo.com  || echo "open-meteo DNS xato"
          echo "=== Ulanish tekshirish ==="
          curl -s --max-time 10 -o /dev/null -w "%{http_code}\n" https://monitoring.meteo.uz/ || echo "monitoring.meteo.uz ulanmadi"
          curl -s --max-time 10 -o /dev/null -w "%{http_code}\n" https://data.meteo.uz/      || echo "data.meteo.uz ulanmadi"
          echo "=== monitoring.meteo.uz: runnerdan tekshiruv ==="
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0.0.0 Safari/537.36"
          for u in "https://monitoring.meteo.uz/ru/map/view/107" "https://monitoring.meteo.uz/api/maps"; do
            code=$(curl -s -L --max-time 20 -A "$UA" -H "Referer: https://monitoring.meteo.uz/" -o /tmp/p.html -w "%{http_code}" "$u" || echo 000)
            size=$(wc -c < /tmp/p.html 2>/dev/null || echo 0)
            pm=$(grep -c "PM 2.5" /tmp/p.html 2>/dev/null || true)
            title=$(grep -o "<title>[^<]*" /tmp/p.html 2>/dev/null | head -1 | cut -c8-80)
            echo "::warning title=diag::$u code=$code size=$size pm25_matn=${pm:-0} title=$title"
            if [ "${pm:-0}" = "0" ]; then echo "::warning title=diag-boshi::$(head -c 400 /tmp/p.html | tr -d '\n\r' | tr -s ' ')"; fi
          done
          echo "::warning title=diag-ip::$(curl -s --max-time 10 https://ipinfo.io/json | tr -d '\n ' | cut -c1-220)"

      - name: Pipeline ishga tushirish
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          DATAMETEO_USERNAME:  ${{ secrets.DATAMETEO_USERNAME }}
          DATAMETEO_PASSWORD:  ${{ secrets.DATAMETEO_PASSWORD }}
          DATAMETEO_API_TOKEN: ${{ secrets.DATAMETEO_API_TOKEN }}
          LOG_PATH:            unified_pipeline.log
          DASHBOARD_JSON_PATH: dashboard_data.json
        run: python unified_pipeline.py

      - name: Log ni artifact sifatida saqlash
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pipeline-log-${{ github.run_number }}
          path: unified_pipeline.log
          retention-days: 7
