name: Havo Monitoringi Pipeline

on:
  workflow_dispatch:          # asosiy: Supabase pg_cron har soat :13 da chaqiradi
  schedule:
    - cron: "43 * * * *"      # zaxira: soat boshidan uzoq (GitHub soat boshida eng band)

concurrency:                  # bir vaqtda ikkita run bo'lmasin
  group: collector
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v5

      - name: Python o'rnatish
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Kutubxonalar o'rnatish
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: DNS va tarmoq tekshirish
        run: |
          echo "=== DNS tekshirish ==="
          nslookup monitoring.meteo.uz || echo "monitoring.meteo.uz DNS xato"
          nslookup data.meteo.uz       || echo "data.meteo.uz DNS xato"
          nslookup api.open-meteo.com  || echo "open-meteo DNS xato"
          echo "=== Ulanish tekshirish ==="
          curl -s --max-time 10 -o /dev/null -w "%{http_code}\n" https://monitoring.meteo.uz/ || echo "monitoring.meteo.uz ulanmadi"
          curl -s --max-time 10 -o /dev/null -w "%{http_code}\n" https://data.meteo.uz/      || echo "data.meteo.uz ulanmadi"

      - name: Pipeline ishga tushirish
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          DATAMETEO_USERNAME:  ${{ secrets.DATAMETEO_USERNAME }}
          DATAMETEO_PASSWORD:  ${{ secrets.DATAMETEO_PASSWORD }}
          DATAMETEO_API_TOKEN: ${{ secrets.DATAMETEO_API_TOKEN }}
          LOG_PATH:            unified_pipeline.log
          DASHBOARD_JSON_PATH: dashboard_data.json
        run: python unified_pipeline.py

      - name: Log ni artifact sifatida saqlash
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pipeline-log-${{ github.run_number }}
          path: unified_pipeline.log
          retention-days: 7
